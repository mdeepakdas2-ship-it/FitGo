name: Build and Deploy App

# Yeh workflow kab-kab run hoga (Triggers)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Aap ise GitHub dashboard se manual bhi run kar sakte hain

jobs:
  build:
    name: Build App on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest] # Aap chahein toh windows-latest ya macos-latest bhi jod sakte hain

    steps:
      # Step 1: Repository ka code checkout karna
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Node.js environment setup karna (Agar aapka app Web/JS/React/Next.js par hai)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Dependencies install karna
      - name: Install Dependencies
        run: npm install

      # Step 4: App Build / Compile karna
      - name: Run Build
        run: npm run build --if-present

      # Step 5: (Optional) Testing run karna agar aapke project mein tests hain
      - name: Run Tests
        run: npm test --if-present
        continue-on-error: true
