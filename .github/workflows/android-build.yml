name: Build Android App & Generate APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest

    steps:
      # Step 1: Repository ka code checkout karna
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Java JDK 17 setup karna (Android development ke liye zaroori hai)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Gradle Wrapper ko executable permission dena
      - name: Grant execute permission for gradlew
        run: cd FitGo-Android && chmod +x gradlew

      # Step 4: Debug APK Build karna Gradle ke zariye
      - name: Build Debug APK
        run: cd FitGo-Android && ./gradlew assembleDebug

      # Step 5: Build hone ke baad APK file ko GitHub par artifact ke roop mein save karna
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: FitGo-Android/app/build/outputs/apk/debug/app-debug.apk
